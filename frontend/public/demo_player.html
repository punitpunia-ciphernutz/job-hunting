<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TaaliTrack — Full Feature Demo Video Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .header {
      padding: 16px 24px;
      background: #0F172A;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid #2563EB;
      color: #93C5FD;
      font-weight: 600;
    }
    .video-wrap {
      padding: 20px;
      background: #0B0F19;
      display: flex;
      justify-content: center;
    }
    .video-wrap img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .footer {
      padding: 14px 24px;
      background: #0F172A;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #94A3B8;
    }
    .links a {
      color: #60A5FA;
      text-decoration: none;
      font-weight: 600;
      margin-left: 16px;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">
        <span>👏 TaaliTrack — Job Hunt Autopilot</span>
        <span class="badge">Live Feature Testing Video</span>
      </div>
      <div style="font-size: 13px; color: #94A3B8;">
        Garbathon 2026 (GDG Ahmedabad)
      </div>
    </div>
    <div class="video-wrap">
      <img src="demo_video.webp" alt="TaaliTrack Live Features Demo Video" />
    </div>
    <div class="footer">
      <div>
        Showing: Pipeline Board (Kanban), Company Drawer, 7-Day Follow-Up Queue, Scam X-Ray & Live Simulations.
      </div>
      <div class="links">
        <a href="http://localhost:3000" target="_blank">Open Live App (Port 3000) &rarr;</a>
      </div>
    </div>
  </div>
</body>
</html>
